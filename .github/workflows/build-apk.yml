name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Bygg
        run: ./gradlew --no-daemon assembleDebug
      - name: Döp om APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BambuLive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BambuLive-apk
          path: BambuLive.apk
      - name: Publicera som release (lätt att ladda ner från mobilen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          name: Bambu Live (${{ github.ref_name }})
          prerelease: true
          files: BambuLive.apk
